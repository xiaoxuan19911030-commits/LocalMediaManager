name: Feature request
description: Suggest a user workflow or product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem rather than only the requested control.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data and file safety considerations
      description: Note any database or filesystem writes, confirmation and rollback expectations.

