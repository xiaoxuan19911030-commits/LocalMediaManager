name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm build:web
      - name: Test Bridge
        run: dotnet test backend/LocalMediaManager.Bridge.Tests/LocalMediaManager.Bridge.Tests.csproj -c Release
      - name: Build Migration
        run: dotnet build backend/LocalMediaManager.Migration/LocalMediaManager.Migration.csproj -c Release
      - name: Check Tauri host
        run: cargo check --manifest-path src-tauri/Cargo.toml

